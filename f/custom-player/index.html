<!doctype html>
<html lang="fr" data-theme="black">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5/dist/index.global.min.js"></script>
  <link rel="stylesheet" href="avant.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center">
  <div class="min-h-screen grid place-items-center font-sans">
    <main class="w-[90vw] max-w-2xl">
      <video id="film" class="block w-full rounded-t-lg">
        <source
          src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm"
          type="video/webm"
        />
      </video>

      <div class="flex items-center gap-4 px-4 py-3 bg-neutral-800 rounded-b-lg">
        <button
          id="lecture"
          class="px-4 py-2 rounded bg-red-600 hover:bg-red-700 text-white font-bold cursor-pointer"
        >
          Lecture / Pause
        </button>
        <div class="flex-1 h-2 bg-neutral-600 rounded overflow-hidden">
          <div id="barre" class="w-0 h-full bg-red-600"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/ScrambleTextPlugin.min.js"></script>
  <script src="avant.js"></script>
  <script src="script.js"></script>
</body>
</html>
