<!doctype html>
<html lang="fr" data-theme="black">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecteur video HTML personnalisé</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5/dist/index.global.min.js"></script>
  <link rel="stylesheet" href="avant.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center">
  <div class="min-h-screen grid place-items-center font-sans">
    <main class="w-[90vw] max-w-2xl">
      <video id="film" class="block w-full max-h-[70vh] rounded-t-lg">
        <source
          src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm"
          type="video/webm"
        />
      </video>

      <div class="flex items-center gap-4 p-4 bg-black/50 rounded-b-lg">
        <button id="lecture" class="px-4 py-2 rounded-full bg-red-600 text-white">
          Jouer
        </button>
        <div class="flex-1 h-3 bg-white/30 rounded-full">
          <div id="barre" class="w-0 h-full bg-red-600 rounded-full"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
