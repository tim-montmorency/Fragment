<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSAP - Scrolltrigger Snap + Tag</title>
  <link rel="stylesheet" href="avant.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="espace">Défilez vers le bas, puis arrêtez-vous ↓</section>

  <section class="scene">
    <div class="piste">
      <span class="arret" style="left: 0%">0</span>
      <span class="arret" style="left: 25%">0.25</span>
      <span class="arret" style="left: 100%">1</span>
      <div class="boite"></div>
    </div>
  </section>

  <section class="espace">Fin</section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
