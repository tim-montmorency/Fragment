<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSAP - Scrolltrigger toggle actions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="espace">Défilez vers le bas, puis remontez ↕</section>

  <div class="carte">
    <h2>toggleActions</h2>
    <p>Observez ce que fait la carte à chacun des 4 moments.</p>
  </div>

  <section class="espace"></section>

  <!-- Tableau de bord : seulement pour voir quel moment vient de se produire -->
  <div class="moments">
    <div class="moment"><strong>onEnter</strong><span>entre en descendant</span><code></code></div>
    <div class="moment"><strong>onLeave</strong><span>sort en descendant</span><code></code></div>
    <div class="moment"><strong>onEnterBack</strong><span>revient en remontant</span><code></code></div>
    <div class="moment"><strong>onLeaveBack</strong><span>ressort en remontant</span><code></code></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
