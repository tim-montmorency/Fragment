<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web 5 - GSAP : timeline et position</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="row">
      <p class="label">1 · à la suite</p>
      <div class="track"><div class="box b1"></div></div>
    </div>
    <div class="row">
      <p class="label">2 · "-=0.5"</p>
      <div class="track"><div class="box b2"></div></div>
    </div>
    <div class="row">
      <p class="label">3 · "&lt;"</p>
      <div class="track"><div class="box b3"></div></div>
    </div>
    <div class="row">
      <p class="label">4 · "+=0.5"</p>
      <div class="track"><div class="box b4"></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
