# Publication de Fragment sur GitHub Pages.
#
# Remplace le « pages-build-deployment » automatique (Source : Deploy from a branch),
# qui échoue quand plusieurs enregistrements du Studio arrivent à quelques secondes
# d'intervalle : un déploiement démarre pendant qu'un autre est en cours et GitHub
# le refuse. Le site reste alors sur une version antérieure.
#
# Ici, une seule publication à la fois (groupe « pages »). Si plusieurs commits
# arrivent pendant une publication, seuls le déploiement en cours et le plus récent
# en attente sont conservés : les intermédiaires sont annulés (gris, pas rouge),
# et la dernière version enregistrée finit toujours en ligne.
#
# Activation : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
#
# Déploiement coincé : il arrive que GitHub ne termine jamais un déploiement Pages.
# La publication abandonne après 10 minutes, mais le déploiement reste « en cours » chez GitHub
# et toutes les suivantes échouent (« due to in progress deployment »). L'étape « Débloquer »
# annule ce déploiement avant de publier : grâce au groupe « pages », aucune autre publication
# ne tourne à ce moment, donc tout déploiement encore en cours est forcément coincé.

name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Débloquer un déploiement coincé
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=20" --jq '.[].sha' | sort -u); do
            statut=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$sha" --jq '.status' 2>/dev/null) || continue
            # Seuls les états « en cours » connus sont annulés ; un état vide ou inconnu est laissé tel quel
            case "$statut" in
              deployment_queued|deployment_in_progress|syncing_files|finished_file_sync|updating_pages|purging_cdn)
                echo "Déploiement $sha resté « $statut » : annulation."
                gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" || true
                ;;
            esac
          done
      - id: deploiement
        uses: actions/deploy-pages@v4
