# Publication de Fragment sur GitHub Pages.
#
# Remplace le « pages-build-deployment » automatique (Source : Deploy from a branch),
# qui échoue quand plusieurs enregistrements du Studio arrivent à quelques secondes
# d'intervalle : un déploiement démarre pendant qu'un autre est en cours et GitHub
# le refuse. Le site reste alors sur une version antérieure.
#
# Ici, une seule publication à la fois (groupe « pages »). Si plusieurs commits
# arrivent pendant une publication, seuls le déploiement en cours et le plus récent
# en attente sont conservés : les intermédiaires sont annulés (gris, pas rouge),
# et la dernière version enregistrée finit toujours en ligne.
#
# Activation : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
#
# Panne de GitHub Pages : il arrive que GitHub ne termine jamais un déploiement. Il reste alors
# « en cours » de son côté et refuse toutes les publications suivantes (« due to in progress
# deployment. Please cancel … first »). Pour échouer vite et se débloquer seul :
#   - « Débloquer » annule les déploiements récents restés en échec ou en cours (grâce au groupe
#     « pages », aucune autre publication ne tourne à ce moment) ;
#   - une publication qui ne répond pas abandonne après 3 minutes (normalement : ~25 s) ;
#   - un seul nouvel essai, 1 minute plus tard, après un nouveau déblocage.

name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url || steps.essai2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Débloquer un déploiement coincé
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/debloquer.sh" <<'FIN'
          # Déploiements récents (sauf celui-ci) dont le dernier état est un échec ou « en cours » : annulés.
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=10" \
            --jq '.[] | select(.sha != env.GITHUB_SHA) | "\(.id) \(.sha)"' |
          while read -r id sha; do
            etat=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state' 2>/dev/null)
            case "$etat" in
              failure|error|in_progress|queued|pending)
                echo "Déploiement ${sha:0:7} (« $etat ») : annulation."
                gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" >/dev/null 2>&1 || true
                ;;
            esac
          done
          FIN
          bash "$RUNNER_TEMP/debloquer.sh"

      - id: deploiement
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000

      - name: Nouvel essai dans 1 minute
        if: steps.deploiement.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash "$RUNNER_TEMP/debloquer.sh"
          sleep 60
      - id: essai2
        if: steps.deploiement.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
