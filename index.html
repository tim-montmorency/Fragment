<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fragment</title>
  <meta name="description" content="Fragments : petits exemples interactifs HTML, CSS et JavaScript.">
  <link rel="preload" href="commun/polices/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="commun/theme.css">
  <link rel="stylesheet" href="commun/galerie.css">
</head>
<body>
  <header class="entete">
    <div class="marque">
      <h1>Fragment</h1>
      <p class="description">Petits exemples interactifs HTML, CSS et JavaScript</p>
    </div>
    <div class="outils">
      <div class="recherche">
        <svg class="icone" aria-hidden="true"><use href="commun/icones.svg#search"/></svg>
        <input type="search" id="recherche" class="input" placeholder="Rechercher un fragment…" aria-label="Rechercher un fragment" autocomplete="off" spellcheck="false">
      </div>
      <a class="btn" href="studio/">
        <svg class="icone" aria-hidden="true"><use href="commun/icones.svg#plus"/></svg>
        Nouveau fragment
      </a>
    </div>
  </header>

  <main>
    <nav class="tags" id="tags" aria-label="Filtrer par tag"></nav>
    <p class="avis" id="avis" hidden></p>
    <p class="compte description" id="compte" aria-live="polite"></p>
    <ul class="grille" id="grille"></ul>
    <p class="vide description" id="vide" hidden></p>
  </main>

  <script src="commun/ui.js"></script>
  <script src="commun/galerie.js"></script>
</body>
</html>
